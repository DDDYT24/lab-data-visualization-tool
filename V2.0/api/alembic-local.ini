; Manual CLI access to the local SQLite revision chain, for example:
;   alembic -c alembic-local.ini -x url=sqlite+pysqlite:///./.labviz/labviz-v2.db history
; The application itself builds this configuration in labviz_api/local_schema.py so that
; it never depends on a working directory inside a packaged installation.
[alembic]
script_location = %(here)s/migrations_local
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite+pysqlite:///./.labviz/labviz-v2.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
