name: labviz-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${LABVIZ_POSTGRES_USER:-labviz}
      POSTGRES_PASSWORD: ${LABVIZ_POSTGRES_PASSWORD:-labviz-local}
      POSTGRES_DB: ${LABVIZ_POSTGRES_DB:-labviz}
    ports:
      - "127.0.0.1:${LABVIZ_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LABVIZ_MINIO_ROOT_USER:-labviz-minio}
      MINIO_ROOT_PASSWORD: ${LABVIZ_MINIO_ROOT_PASSWORD:-labviz-minio-local-only}
    ports:
      - "127.0.0.1:${LABVIZ_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${LABVIZ_MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${LABVIZ_MINIO_ROOT_USER:-labviz-minio}
      MINIO_ROOT_PASSWORD: ${LABVIZ_MINIO_ROOT_PASSWORD:-labviz-minio-local-only}
      LABVIZ_MINIO_BUCKET: ${LABVIZ_MINIO_BUCKET:-labviz-test}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${LABVIZ_MINIO_BUCKET}"

volumes:
  postgres-data:
  minio-data:
