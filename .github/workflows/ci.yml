name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            V1.1/requirements.txt
            V1.1/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint, format, and type-check
        run: |
          ruff check app.py main.py labviz tests
          ruff format --check app.py main.py labviz tests
          mypy app.py main.py labviz
      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2.0/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: V2.0/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend
        run: npm run verify
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify browser flows
        run: npm run test:e2e

  v2-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labviz
          POSTGRES_PASSWORD: labviz-ci
          POSTGRES_DB: labviz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labviz -d labviz_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LABVIZ_TEST_POSTGRES_URL: postgresql+psycopg://labviz:labviz-ci@127.0.0.1:5432/labviz_test
    defaults:
      run:
        working-directory: V2.0/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            V2.0/api/requirements.txt
            V2.0/api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify API
        run: |
          ruff check labviz_api tests migrations scripts
          ruff format --check labviz_api tests migrations scripts
          mypy labviz_api tests migrations scripts
          pytest
