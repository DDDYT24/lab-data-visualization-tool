name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            V1.1/requirements.txt
            V1.1/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint, format, and type-check
        run: |
          ruff check app.py main.py labviz tests
          ruff format --check app.py main.py labviz tests
          mypy app.py main.py labviz
      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: V2.0/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: V2.0/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test the npm audit gate
        run: python3 -m unittest discover -s ../../.github/scripts -p "test_*.py"
      - name: Audit dependencies (only owner-reviewed findings pass)
        run: python3 ../../.github/scripts/npm_audit_gate.py
      - name: Verify frontend
        run: npm run verify
      - name: Install browser test engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser flows
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: V2.0/web/test-results/
          retention-days: 7

  v2-api:
    runs-on: ubuntu-latest
    env:
      LABVIZ_POSTGRES_USER: labviz
      LABVIZ_POSTGRES_PASSWORD: labviz-ci
      LABVIZ_POSTGRES_DB: labviz
      LABVIZ_POSTGRES_PORT: "54329"
      LABVIZ_MINIO_ROOT_USER: labviz-minio
      LABVIZ_MINIO_ROOT_PASSWORD: labviz-minio-ci-only
      LABVIZ_MINIO_PORT: "59000"
      LABVIZ_MINIO_BUCKET: labviz-test
      LABVIZ_TEST_POSTGRES_URL: postgresql+psycopg://labviz:labviz-ci@127.0.0.1:54329/labviz_test
      LABVIZ_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
      LABVIZ_TEST_MINIO_BUCKET: labviz-test
      LABVIZ_TEST_MINIO_ACCESS_KEY: labviz-minio
      LABVIZ_TEST_MINIO_SECRET_KEY: labviz-minio-ci-only
    defaults:
      run:
        working-directory: V2.0/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            V2.0/api/requirements.txt
            V2.0/api/requirements-dev.txt
            V2.0/api/requirements.lock.txt
            V2.0/api/requirements-dev.lock.txt
      - name: Start API integration services
        run: docker compose up -d --wait postgres minio
      - name: Initialize MinIO test bucket
        run: docker compose run --rm minio-init
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Verify API
        run: |
          ruff check labviz_api tests migrations scripts
          ruff format --check labviz_api tests migrations scripts
          mypy labviz_api tests migrations scripts
          pytest
      - name: Stop API integration services
        if: always()
        run: docker compose down -v --remove-orphans

  plan-parity:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    defaults:
      run:
        working-directory: V2.0/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: V2.0/api/requirements.lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Fixture matrix and RenderPlan parity
        run: python scripts/run_v22_matrix.py --output "$RUNNER_TEMP/matrix-report.json" > /dev/null
      - name: Chaos matrix
        run: |
          python scripts/chaos_100_matrix.py generate --root "$RUNNER_TEMP/chaos"
          python scripts/chaos_100_matrix.py verify --root "$RUNNER_TEMP/chaos" | tail -n 1
      - name: Preserve matrix reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan-parity-reports
          path: |
            ${{ runner.temp }}/matrix-report.json
            ${{ runner.temp }}/chaos/test-report.json
          retention-days: 7

  live-charts:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LABVIZ_PERSISTENCE_BACKEND: sqlite
      LABVIZ_OBJECT_STORAGE_BACKEND: local
      LABVIZ_ENVIRONMENT: development
      LABVIZ_AUTH_MODE: console
      LABVIZ_API_PROXY_TARGET: http://127.0.0.1:8000
      LABVIZ_ALLOWED_ORIGINS: http://localhost:3100
      LABVIZ_PUBLIC_WEB_URL: http://localhost:3100
      LABVIZ_E2E_LIVE: "1"
      LABVIZ_E2E_INTERFACE_MODE: classic
      # The distribution spec reads its exported files back with the API's Python.
      LABVIZ_E2E_ARTIFACT_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: V2.0/api/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: V2.0/web/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r V2.0/api/requirements.lock.txt
          npm ci --prefix V2.0/web
          npx --prefix V2.0/web playwright install --with-deps chromium
      - name: Start the local API
        working-directory: V2.0/api
        run: |
          key=$(python -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$key"
          echo "LABVIZ_LOCAL_ACCESS_KEY=$key" >> "$GITHUB_ENV"
          echo "LABVIZ_E2E_LOCAL_ACCESS_KEY=$key" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/live/objects"
          export LABVIZ_DATABASE_PATH="$RUNNER_TEMP/live/labviz.db"
          export LABVIZ_OBJECT_STORAGE_ROOT="$RUNNER_TEMP/live/objects"
          LABVIZ_LOCAL_ACCESS_KEY=$key nohup python -m uvicorn --factory labviz_api.main:create_app \
            --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/live/api.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/live/api.log"
          exit 1
      - name: Live chart specs against the real API
        working-directory: V2.0/web
        run: >-
          npx playwright test --project=chromium --workers=1
          e2e/live-classic-plans.spec.ts e2e/live-research-charts.spec.ts
          e2e/live-research-figures.spec.ts e2e/live-distribution-parity.spec.ts
      - name: Preserve live failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-chart-evidence
          path: |
            V2.0/web/test-results/
            ${{ runner.temp }}/live/api.log
          retention-days: 7

  v2-containers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2.0
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build -f api/Dockerfile -t labviz-api:ci .
      - name: Check bundled API resources
        run: >-
          docker run --rm --entrypoint python labviz-api:ci -c
          "from labviz_api.research_preparation import LIMITS;
          from labviz_api.sample_catalog import public_samples, sample_payload;
          from labviz_api.main import app;
          assert LIMITS;
          assert all(sample_payload(s.slug)[1] for s in public_samples());
          print('API, scientific contracts, and synthetic samples loaded')"
      - name: Build production Web image
        run: docker build -f web/Dockerfile -t labviz-web:ci .
      - name: Build logical-backup image
        run: docker build -f deploy/aws/backup/Dockerfile -t labviz-logical-backup:ci .
