name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            V1.1/requirements.txt
            V1.1/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint, format, and type-check
        run: |
          ruff check app.py main.py labviz tests
          ruff format --check app.py main.py labviz tests
          mypy app.py main.py labviz
      - name: Test
        run: pytest -q --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: V2.0/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: V2.0/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend
        run: npm run verify
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify browser flows
        run: npm run test:e2e

  v2-api:
    runs-on: ubuntu-latest
    env:
      LABVIZ_POSTGRES_USER: labviz
      LABVIZ_POSTGRES_PASSWORD: labviz-ci
      LABVIZ_POSTGRES_DB: labviz
      LABVIZ_POSTGRES_PORT: "54329"
      LABVIZ_MINIO_ROOT_USER: labviz-minio
      LABVIZ_MINIO_ROOT_PASSWORD: labviz-minio-ci-only
      LABVIZ_MINIO_PORT: "59000"
      LABVIZ_MINIO_BUCKET: labviz-test
      LABVIZ_TEST_POSTGRES_URL: postgresql+psycopg://labviz:labviz-ci@127.0.0.1:54329/labviz_test
      LABVIZ_TEST_MINIO_ENDPOINT: http://127.0.0.1:59000
      LABVIZ_TEST_MINIO_BUCKET: labviz-test
      LABVIZ_TEST_MINIO_ACCESS_KEY: labviz-minio
      LABVIZ_TEST_MINIO_SECRET_KEY: labviz-minio-ci-only
    defaults:
      run:
        working-directory: V2.0/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            V2.0/api/requirements.txt
            V2.0/api/requirements-dev.txt
            V2.0/api/requirements.lock.txt
            V2.0/api/requirements-dev.lock.txt
      - name: Start API integration services
        run: docker compose up -d --wait postgres minio
      - name: Initialize MinIO test bucket
        run: docker compose run --rm minio-init
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Verify API
        run: |
          ruff check labviz_api tests migrations scripts
          ruff format --check labviz_api tests migrations scripts
          mypy labviz_api tests migrations scripts
          pytest
      - name: Stop API integration services
        if: always()
        run: docker compose down -v --remove-orphans

  v2-containers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V2.0
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build -f api/Dockerfile -t labviz-api:ci api
      - name: Build production Web image
        run: docker build -f web/Dockerfile -t labviz-web:ci .
      - name: Build logical-backup image
        run: docker build -f deploy/aws/backup/Dockerfile -t labviz-logical-backup:ci .
